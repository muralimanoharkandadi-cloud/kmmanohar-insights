# Custom branded 404 page instead of Netlify's generic default.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
# Interactive Knowledge Cards (Glossary) payload - small file, safe to cache
# aggressively client-side; a fresh copy ships on every rebuild anyway so a
# short max-age keeps repeat pageviews fast without risking stale terms for
# more than a few minutes after an edit + rebuild.
[[headers]]
  for = "/assets/glossary.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
